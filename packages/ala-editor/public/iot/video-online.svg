<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景电视外框 -->
  <rect x="30" y="50" rx="20" ry="20" width="140" height="120" fill="#1e90ff" />

  <!-- 缩短后的两根天线 -->
  <line x1="60" y1="50" x2="45" y2="30" stroke="#1e90ff" stroke-width="12" stroke-linecap="round" />
  <line x1="140" y1="50" x2="155" y2="30" stroke="#1e90ff" stroke-width="12" stroke-linecap="round" />

  <!-- 播放图标：标准圆角三角形 -->
  <g transform="translate(100,100)">
    <path d="
      M -18 -18
      Q -16 -1 -18 18
      Q -2 12 18 0
      Q -2 -12 -18 -18 Z
    " fill="#ffffff" />
    
    <!-- 动画：中心缩放 -->
    <animateTransform attributeName="transform"
                      type="scale"
                      values="1;1.6;1"
                      dur="2s"
                      repeatCount="indefinite"
                      additive="sum"
                      begin="0s" />
  </g>
</svg>
