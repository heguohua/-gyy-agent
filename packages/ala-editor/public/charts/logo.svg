<svg
  viewBox="0 0 420 120"
  width="100%"
  height="100%"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid meet">

  <style>
    .letter {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 72px; /* 标准高度 */
      font-weight: bold;

      fill: #00a8ff;
      opacity: 0.6;

      text-anchor: middle;
    }
  </style>

  <!-- G -->
  <text x="90" y="90" class="letter" transform="rotate(5 90 90)">
    G
    <animate attributeName="opacity"
             values="0.6;1;0.6"
             keyTimes="0;0.6;1"
             dur="5s"
             repeatCount="indefinite"/>
  </text>

  <!-- Y -->
  <text x="150" y="90" class="letter" transform="rotate(5 150 90)">
    Y
    <animate attributeName="opacity"
             values="0.6;1;0.6"
             keyTimes="0;0.6;1"
             dur="5s"
             repeatCount="indefinite"/>
  </text>

  <!-- Y -->
  <text x="210" y="90" class="letter" transform="rotate(5 210 90)">
    Y
    <animate attributeName="opacity"
             values="0.6;1;0.6"
             keyTimes="0;0.6;1"
             dur="5s"
             repeatCount="indefinite"/>
  </text>

  <!-- U -->
  <text x="270" y="90" class="letter" transform="rotate(5 270 90)">
    U
    <animate attributeName="opacity"
             values="0.6;1;0.6"
             keyTimes="0;0.6;1"
             dur="5s"
             repeatCount="indefinite"/>
  </text>

  <!-- N -->
  <text x="330" y="90" class="letter" transform="rotate(5 330 90)">
    N
    <animate attributeName="opacity"
             values="0.6;1;0.6"
             keyTimes="0;0.6;1"
             dur="5s"
             repeatCount="indefinite"/>
  </text>

</svg>
