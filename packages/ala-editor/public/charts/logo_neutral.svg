<svg
  viewBox="0 0 360 120"
  width="100%"
  height="100%"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid meet">

  <style>
    .letter {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 120px;
      font-weight: bold;

      fill: #00a8ff;
      opacity: 0.6;

      text-anchor: middle;
    }
  </style>

  <text x="84.96" y="100" class="letter" transform="rotate(5 84.96 100)">
    X
    <animate
      attributeName="opacity"
      values="0.6;1;0.6"
      keyTimes="0;0.6;1"
      dur="5s"
      repeatCount="indefinite"/>
  </text>

  <text x="180" y="100" class="letter" transform="rotate(5 180 100)">
    Y
    <animate
      attributeName="opacity"
      values="0.6;1;0.6"
      keyTimes="0;0.6;1"
      dur="5s"
      repeatCount="indefinite"/>
  </text>

  <text x="275.04" y="100" class="letter" transform="rotate(5 275.04 100)">
    Z
    <animate
      attributeName="opacity"
      values="0.6;1;0.6"
      keyTimes="0;0.6;1"
      dur="5s"
      repeatCount="indefinite"/>
  </text>

</svg>

